    steps:
      - name: Read one row from the database
        run: |
          curl -fsS "https://mqhhpedpkddpifatmgtc.supabase.co/rest/v1/keep_alive?select=id&limit=1" \
            -H "apikey: sb_publishable_L-KEAEVrx7-cEtP1xryU_w_Yt8qNcza"
